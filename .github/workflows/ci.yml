name: CI

on:
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --experimental-strip-types --test tests/unit/*.test.ts

  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3210
      COMPONENT_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Mount component fixtures for this test build only
        run: |
          mkdir -p src/app/checks-contacts
          cp tests/fixtures/contact-form/page.tsx src/app/checks-contacts/page.tsx
          mkdir -p src/app/checks-address
          cp tests/fixtures/address-form/page.tsx src/app/checks-address/page.tsx
      - run: npm run build
      - name: Prepare standalone for Playwright
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
